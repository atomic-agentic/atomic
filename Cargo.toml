# SPDX-License-Identifier: Apache-2.0

[workspace]
resolver = "3"
members = [
    "crates/atomic",
    "crates/atomic-atoms",
    "crates/atomic-core",
    "crates/atomic-durable",
    "crates/atomic-exec",
    "crates/atomic-graph",
    "crates/atomic-schema",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
# The toolchain Codex pins at the revision in deps/codex.toml.
rust-version = "1.95.0"
license = "Apache-2.0"
repository = "https://github.com/atomic-agentic/atomic"
publish = false

[workspace.dependencies]
atomic-atoms = { path = "crates/atomic-atoms" }
atomic-core = { path = "crates/atomic-core" }
atomic-durable = { path = "crates/atomic-durable" }
atomic-exec = { path = "crates/atomic-exec" }
atomic-graph = { path = "crates/atomic-graph" }
atomic-schema = { path = "crates/atomic-schema" }

# atomic's fork of durare, at the revision in deps/durare.toml. Only
# atomic-durable may depend on it.
durare = { git = "https://github.com/atomic-agentic/durare", rev = "9c93328ded1e68447afa622c85b8144196cd41b6", default-features = false, features = ["sqlite", "postgres"] }

# Third-party crates.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", default-features = false }

# Codex, at the revision in deps/codex.toml (scripts/codex-pin.sh checks it).
# Only atomic-core may depend on these.
codex-app-server = { git = "https://github.com/openai/codex", rev = "d32063f96c2dff1dc96af839b3952abb6acfeda4" }
codex-core-api = { git = "https://github.com/openai/codex", rev = "d32063f96c2dff1dc96af839b3952abb6acfeda4" }
codex-extension-api = { git = "https://github.com/openai/codex", rev = "d32063f96c2dff1dc96af839b3952abb6acfeda4" }

# Codex is a large dependency; full debug info for every crate makes a debug
# build tens of gigabytes. Keep line tables for atomic's own crates (enough for
# backtraces) and drop debug info for dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

