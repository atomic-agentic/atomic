# SPDX-License-Identifier: Apache-2.0

[workspace]
resolver = "3"
members = [
    "crates/atomic",
    "crates/atomic-atoms",
    "crates/atomic-core",
    "crates/atomic-durable",
    "crates/atomic-exec",
    "crates/atomic-graph",
    "crates/atomic-schema",
]
# Builds upstream durare's own sqlx 0.8 graph to dump its schema; see its manifest.
# third_party holds vendored crates the patch block points at (third_party/deno).
exclude = ["crates/atomic-durable/tests/dbos_schema/upstream", "third_party"]

[workspace.package]
version = "0.2.0"
edition = "2024"
# The toolchain Codex pins at the revision in deps/codex.toml.
rust-version = "1.95.0"
license = "Apache-2.0"
repository = "https://github.com/atomic-agentic/atomic"
publish = false

[workspace.dependencies]
# Packages are named atomic-agentic-*, the project's name on crates.io; these
# aliases keep the short names in code (`use atomic_core::...`).
atomic-atoms = { path = "crates/atomic-atoms", package = "atomic-agentic-atoms" }
atomic-core = { path = "crates/atomic-core", package = "atomic-agentic-core" }
atomic-durable = { path = "crates/atomic-durable", package = "atomic-agentic-durable" }
atomic-exec = { path = "crates/atomic-exec", package = "atomic-agentic-exec" }
atomic-graph = { path = "crates/atomic-graph", package = "atomic-agentic-graph" }
atomic-schema = { path = "crates/atomic-schema", package = "atomic-agentic-schema" }

# atomic's fork of durare, at the revision in deps/forks.toml. Only
# atomic-durable may depend on it.
durare = { git = "https://github.com/atomic-agentic/durare", rev = "51e19b5068f1ececcc9599d8bfc2a04157ff7f10", default-features = false, features = ["sqlite", "postgres"] }

# Third-party crates.
anyhow = "1"
cel = { version = "0.16", default-features = false, features = ["regex", "json"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
globset = "0.4"
ignore = "0.4"
# No default features: schemas never come from the network.
jsonschema = { version = "0.61", default-features = false }
regex = "1"
# Lite atoms' model client: the version and TLS stack Codex's own client uses.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots"] }
# The proxy matcher reqwest's client uses, asked whether a call would go by a
# proxy, and the URI type it takes: the versions Codex locks.
hyper-util = { version = "0.1.20", default-features = false, features = ["client-proxy"] }
http = "1"
saphyr-parser = "0.3.4"
thiserror = "2"
# Telemetry: the versions Codex locks, with no features Codex does not
# already turn on.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
tracing-opentelemetry = { version = "0.32", default-features = false }
opentelemetry = { version = "0.31", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.31", default-features = false, features = ["trace", "rt-tokio", "experimental_trace_batch_span_processor_with_async_runtime"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["trace", "http-proto", "http-json", "grpc-tonic", "reqwest-blocking-client"] }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12.1"
getrandom = "0.3.4"
libc = "0.2.186"
# getifaddrs, at a version already in the lockfile.
nix = { version = "0.29", features = ["net"] }
# The Public Suffix List, at the version Codex locks.
psl = "2.1.184"
# The filter that keeps a sandboxed command off the kernel keyrings; Codex's version.
seccompiler = "0.5.0"
# The same sqlx Codex and the durare fork use (the patch block pins its source).
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled"] }
tokio = { version = "1", default-features = false }
# The embedded V8 the Astro compiler worker and captured helpers run on:
# deno_core alone, without deno_runtime's I/O extensions (deps/README.md,
# "One V8"). The patch block carries it onto Codex's V8.
deno_core = { version = "=0.413.0", features = ["v8", "v8_use_custom_libcxx"] }
# Lets a test binary serve as the Astro compiler's child before libtest's
# main; only in tests (atomic-core's compiler-in-tests feature). The version
# already in the lockfile.
ctor = "=1.0.6"

# Codex, at the revision in deps/codex.toml (scripts/codex-pin.sh checks it).
# Only atomic-core may depend on these.
codex-app-server = { git = "https://github.com/atomic-agentic/codex", rev = "f08195033e1e1585b9a7c6fd0b9d0e068c18a726" }
codex-core-api = { git = "https://github.com/atomic-agentic/codex", rev = "f08195033e1e1585b9a7c6fd0b9d0e068c18a726" }
codex-exec-server = { git = "https://github.com/atomic-agentic/codex", rev = "f08195033e1e1585b9a7c6fd0b9d0e068c18a726" }
codex-http-client = { git = "https://github.com/atomic-agentic/codex", rev = "f08195033e1e1585b9a7c6fd0b9d0e068c18a726" }
codex-config = { git = "https://github.com/atomic-agentic/codex", rev = "f08195033e1e1585b9a7c6fd0b9d0e068c18a726" }
codex-core = { git = "https://github.com/atomic-agentic/codex", rev = "f08195033e1e1585b9a7c6fd0b9d0e068c18a726" }
codex-windows-sandbox-service = { git = "https://github.com/atomic-agentic/codex", rev = "f08195033e1e1585b9a7c6fd0b9d0e068c18a726" }
codex-windows-sandbox = { git = "https://github.com/atomic-agentic/codex", rev = "f08195033e1e1585b9a7c6fd0b9d0e068c18a726" }
codex-extension-api = { git = "https://github.com/atomic-agentic/codex", rev = "f08195033e1e1585b9a7c6fd0b9d0e068c18a726" }
codex-keyring-store = { git = "https://github.com/atomic-agentic/codex", rev = "f08195033e1e1585b9a7c6fd0b9d0e068c18a726" }
codex-login = { git = "https://github.com/atomic-agentic/codex", rev = "f08195033e1e1585b9a7c6fd0b9d0e068c18a726" }
codex-process-hardening = { git = "https://github.com/atomic-agentic/codex", rev = "f08195033e1e1585b9a7c6fd0b9d0e068c18a726" }
# For the shell environment policy types codex-core-api does not re-export.
codex-protocol = { git = "https://github.com/atomic-agentic/codex", rev = "f08195033e1e1585b9a7c6fd0b9d0e068c18a726" }
# The proxy that limits an exec command declaring network access to its hosts.
codex-network-proxy = { git = "https://github.com/atomic-agentic/codex", rev = "f08195033e1e1585b9a7c6fd0b9d0e068c18a726" }

# Codex is a large dependency; full debug info for every crate makes a debug
# build tens of gigabytes. Keep line tables for atomic's own crates (enough for
# backtraces) and drop debug info for dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Optimize release binaries for size and strip their symbols. The release
# pipeline does not yet archive separate debug symbols.
[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 4
debug = false
strip = "symbols"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

# BEGIN codex patch block: generated by scripts/codex-pin.sh from deps/codex.toml. Do not edit.
[patch.crates-io]
# Uncomment to debug local changes.
# ratatui = { path = "../../ratatui" }
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "ed1cdab335221515706178d68495bba2aed1924f" }
# SQLx 0.9.0 excludes libsqlite3-sys 0.39. Keep its driver and Core traits on
# the same reviewed source until a release includes transact-rs/sqlx#4502.
sqlx-core = { git = "https://github.com/transact-rs/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
sqlx-sqlite = { git = "https://github.com/transact-rs/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "7447c427513cfe685f236e1ac0513c4ea3dd9c0b" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "bc589d684755a8c02da0fc7e58d0861cbfc306f1" }
v8 = { git = "https://github.com/openai-oss-forks/rusty_v8.git", rev = "90a65f887a0c0f048f3784afbcb320b373c8a2e0" }

# Uncomment to debug local changes.
# rmcp = { path = "../../rust-sdk/crates/rmcp" }
# atomic: the Postgres driver from the same sqlx fork revision as sqlx-core.
sqlx-postgres = { git = "https://github.com/transact-rs/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
# atomic: deno_core and deno_v8 carried onto the v8 above (third_party/deno/README.md).
deno_core = { path = "third_party/deno/deno_core" }
deno_v8 = { path = "third_party/deno/deno_v8" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "bc589d684755a8c02da0fc7e58d0861cbfc306f1" }
# END codex patch block
