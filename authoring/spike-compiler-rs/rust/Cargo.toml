# A throwaway trial: Astro's Rust parser (the oxc fork compiler-rs builds on)
# as a pinned git dependency. Its own workspace and lockfile keep it out of
# atomic's dependency graph.
[package]
name = "astro-rs-trial"
version = "0.0.0"
edition = "2024"
rust-version = "1.95.0"
license = "Apache-2.0"
publish = false

[workspace]

[dependencies]
# The revision compiler-rs v0.5.3 pins (its Cargo.toml [workspace.dependencies]).
oxc_allocator = { git = "https://github.com/withastro/oxc", rev = "e5e100abf1afb9a79ae22f97de32befe4b925d5d" }
oxc_ast = { git = "https://github.com/withastro/oxc", rev = "e5e100abf1afb9a79ae22f97de32befe4b925d5d", features = ["serialize"] }
oxc_ast_visit = { git = "https://github.com/withastro/oxc", rev = "e5e100abf1afb9a79ae22f97de32befe4b925d5d", features = ["serialize"] }
oxc_estree = { git = "https://github.com/withastro/oxc", rev = "e5e100abf1afb9a79ae22f97de32befe4b925d5d", features = ["serialize"] }
oxc_parser = { git = "https://github.com/withastro/oxc", rev = "e5e100abf1afb9a79ae22f97de32befe4b925d5d", features = ["astro"] }
oxc_span = { git = "https://github.com/withastro/oxc", rev = "e5e100abf1afb9a79ae22f97de32befe4b925d5d" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = false
panic = "abort"
