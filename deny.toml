# SPDX-License-Identifier: Apache-2.0
#
# cargo-deny policy: licences, advisories, bans and sources. CI runs
# `cargo deny --locked check`; a dependency that breaks this policy fails CI.
#
# atomic ships Codex's crates, so the licence allow-list and the advisory
# exceptions start from Codex's own deny.toml at the revision in
# deps/codex.toml. An exception for an advisory names why it does not apply or
# what must change before it can be removed.

[graph]
# The targets atomic is released for.
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
# Every RustSec advisory fails CI unless it is listed here, with why it does
# not apply to atomic and when to remove it. Nearly all arrive through Codex's
# dependency graph, which atomic's lockfile follows (scripts/lock-check.sh), so
# they leave with a Codex bump; re-check this list at each one.
ignore = [
    { id = "RUSTSEC-2024-0388", reason = "derivative: unmaintained, no known vulnerability; via starlark in codex-execpolicy; remove when Codex drops it" },
    { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained, no known vulnerability; via starlark; remove when Codex drops it" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml: unmaintained, no known vulnerability; via serde_yaml in Codex's skills and plugins; atomic reads YAML with its own restricted loader; remove when Codex drops serde_yaml" },
    { id = "RUSTSEC-2025-0057", reason = "fxhash: unmaintained, no known vulnerability; via starlark and bm25 in Codex; remove when Codex drops it" },
    { id = "RUSTSEC-2025-0141", reason = "bincode 2: unmaintained, no known vulnerability or safe upgrade; via tsz-core in the native TypeScript checker; remove when tsz-core replaces it" },
    { id = "RUSTSEC-2026-0118", reason = "hickory-proto: reached only through Codex's network proxy (codex-network-proxy, rama-dns); atomic builds Codex's permissions with no managed network, so the proxy never starts; remove when Codex's rama moves to a fixed hickory" },
    { id = "RUSTSEC-2026-0119", reason = "hickory-proto: reached only through Codex's network proxy (codex-network-proxy, rama-dns); atomic builds Codex's permissions with no managed network, so the proxy never starts; remove when Codex's rama moves to a fixed hickory" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant: unmaintained, no known vulnerability; via zbus in keyring/secret-service; remove when Codex moves off zbus 4" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: unmaintained, no known vulnerability; via zbus in keyring/secret-service; remove when Codex moves off zbus 4" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: unmaintained, no known vulnerability; via zbus in keyring/secret-service; remove when Codex moves off zbus 4" },
    { id = "RUSTSEC-2026-0374", reason = "basic-toml: unmaintained, no known vulnerability; via i18n-config under age in codex-secrets; remove when Codex drops it" },
    { id = "RUSTSEC-2026-0386", reason = "tokio: the safe AsyncFd constructors accept a descriptor the caller does not own; atomic never calls them. The callers in the graph are Codex's PTY (codex-utils-pty) and exec-server's missing-path watcher, which wrap a File they own. inotify's caller sits behind its stream feature, which is not built; remove when Codex's lockfile has tokio >=1.53.3, which atomic follows" },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint: timing variation in P-256 arithmetic, reached through p256 in age's tag recipients, aws-config (codex-aws-auth) and codex-user-verification (the app server); codex-secrets encrypts with age's scrypt recipient only, atomic authenticates to its endpoint with an API key and never runs the app server; remove when those paths use crypto-bigint >=0.7.6" },
    { id = "RUSTSEC-2026-0391", reason = "zstd: Codex's rollout, thread store and HTTP client, tonic and zip do not reuse a borrowed context across streams; remove when the lockfile has zstd >=0.14.3 (it follows Codex's)" },
    { id = "RUSTSEC-2026-0398", reason = "zstd-safe: Seekable::decompress is behind zstd's seekable feature, which nothing enables; remove when the lockfile has zstd-safe >=8.2.0" },
    { id = "RUSTSEC-2026-0403", reason = "zstd-safe: legacy-format streaming decompression; Codex's users read with decoders into initialized buffers and drop output on error; remove when the lockfile has zstd-safe >=8.2.0" },
    { id = "RUSTSEC-2026-0410", reason = "zstd-sys: the allocator shim bug is wasm32-only, and atomic ships native binaries; remove when the lockfile has zstd-sys >=2.1.2" },
    { id = "RUSTSEC-2026-0441", reason = "pin-utils: unmaintained, no known vulnerability; via aws-smithy crates in codex-aws-auth; remove when Codex drops it" },
    { id = "RUSTSEC-2026-0487", reason = "hickory-proto: reached only through Codex's network proxy (codex-network-proxy, rama-dns); atomic builds Codex's permissions with no managed network, so the proxy never starts; remove when Codex's rama moves to a fixed hickory" },
    { id = "RUSTSEC-2026-0489", reason = "hickory-proto: reached only through Codex's network proxy (codex-network-proxy, rama-dns); atomic builds Codex's permissions with no managed network, so the proxy never starts; remove when Codex's rama moves to a fixed hickory" },
    { id = "RUSTSEC-2026-0490", reason = "hickory-proto: reached only through Codex's network proxy (codex-network-proxy, rama-dns); atomic builds Codex's permissions with no managed network, so the proxy never starts; remove when Codex's rama moves to a fixed hickory" },
    { id = "RUSTSEC-2026-0491", reason = "hickory-proto: reached only through Codex's network proxy (codex-network-proxy, rama-dns); atomic builds Codex's permissions with no managed network, so the proxy never starts; remove when Codex's rama moves to a fixed hickory" },
    { id = "RUSTSEC-2026-0504", reason = "hickory-proto: reached only through Codex's network proxy (codex-network-proxy, rama-dns); atomic builds Codex's permissions with no managed network, so the proxy never starts; remove when Codex's rama moves to a fixed hickory" },
    { id = "RUSTSEC-2026-0505", reason = "hickory-proto: reached only through Codex's network proxy (codex-network-proxy, rama-dns); atomic builds Codex's permissions with no managed network, so the proxy never starts; remove when Codex's rama moves to a fixed hickory" },
    { id = "RUSTSEC-2026-0511", reason = "hickory-proto: reached only through Codex's network proxy (codex-network-proxy, rama-dns); atomic builds Codex's permissions with no managed network, so the proxy never starts; remove when Codex's rama moves to a fixed hickory" },
    { id = "RUSTSEC-2026-0512", reason = "hickory-proto: reached only through Codex's network proxy (codex-network-proxy, rama-dns); atomic builds Codex's permissions with no managed network, so the proxy never starts; remove when Codex's rama moves to a fixed hickory" },
    { id = "RUSTSEC-2026-0514", reason = "hickory-resolver: reached only through Codex's network proxy (codex-network-proxy, rama-dns); atomic builds Codex's permissions with no managed network, so the proxy never starts; remove when Codex's rama moves to a fixed hickory" },
    { id = "RUSTSEC-2026-0530", reason = "hickory-proto: reached only through Codex's network proxy (codex-network-proxy, rama-dns); atomic builds Codex's permissions with no managed network, so the proxy never starts; remove when Codex's rama moves to a fixed hickory" },
    { id = "RUSTSEC-2026-0531", reason = "hickory-proto: reached only through Codex's network proxy (codex-network-proxy, rama-dns); atomic builds Codex's permissions with no managed network, so the proxy never starts; remove when Codex's rama moves to a fixed hickory" },
    { id = "RUSTSEC-2026-0532", reason = "hickory-proto: reached only through Codex's network proxy (codex-network-proxy, rama-dns); atomic builds Codex's permissions with no managed network, so the proxy never starts; remove when Codex's rama moves to a fixed hickory" },
    { id = "RUSTSEC-2026-0543", reason = "chrono: unmaintained, no known vulnerability; used for timestamps throughout Codex and by the durare fork; remove when both move to a maintained time crate" },
    { id = "RUSTSEC-2026-0548", reason = "zip: ZipStreamReader trusts local-header names; nothing in the graph calls it (Codex reads plugin bundles with ZipArchive and writes feedback with ZipWriter), and atomic configures Codex with no plugins and feedback off; remove when the lockfile has zip >=9.0.5 (it follows Codex's)" },
    { id = "RUSTSEC-2026-0549", reason = "hickory-proto: reached only through Codex's network proxy (codex-network-proxy, rama-dns); atomic builds Codex's permissions with no managed network, so the proxy never starts; remove when Codex's rama moves to a fixed hickory" },
    { id = "RUSTSEC-2026-0550", reason = "hickory-proto: reached only through Codex's network proxy (codex-network-proxy, rama-dns); atomic builds Codex's permissions with no managed network, so the proxy never starts; remove when Codex's rama moves to a fixed hickory" },
    { id = "RUSTSEC-2026-0551", reason = "hickory-proto: reached only through Codex's network proxy (codex-network-proxy, rama-dns); atomic builds Codex's permissions with no managed network, so the proxy never starts; remove when Codex's rama moves to a fixed hickory" },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz: unmaintained, no known vulnerability; only the durare fork uses it, for cron time zones; remove when the fork replaces it" },
    { id = "RUSTSEC-2026-0559", reason = "chrono-tz-build: unmaintained, no known vulnerability; build dependency of chrono-tz in the durare fork; remove with chrono-tz" },
]

[licenses]
# Permissive licences, plus the file-level copyleft MPL-2.0, which Codex also
# accepts. Strong copyleft (GPL, AGPL, LGPL) and unlicensed crates fail.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = []

# atomic's own crates are checked like everyone else's.
[licenses.private]
ignore = false

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # Its licence excludes the people who build atomic (AGENTS.md).
    { crate = "beads_rust", reason = "excluded from atomic by its licence rider" },
    # Only atomic-durable may depend on the durable-execution engine: every
    # other crate reaches it through the DurableRuntime trait, so the engine
    # can be replaced behind it.
    { crate = "durare", wrappers = ["atomic-agentic-durable"], reason = "reached only through atomic-durable's DurableRuntime" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Every git dependency is pinned to a commit.
required-git-spec = "rev"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The git sources atomic's dependency graph resolves: Codex (from atomic's
# fork), the forks it patches in and its git dependencies (see Codex's
# deny.toml), and the durare fork (deps/forks.toml). A source the graph stops
# using is removed here.
allow-git = [
    "https://github.com/withastro/oxc",
    "https://github.com/tsz-org/tsz",
    "https://github.com/withastro/compiler-rs",
    "https://github.com/biomejs/biome",
    "https://github.com/atomic-agentic/codex",
    "https://github.com/atomic-agentic/durare",
    "https://github.com/helix-editor/nucleo.git",
    "https://github.com/microsoft/mxc",
    "https://github.com/modelcontextprotocol/rust-sdk",
    "https://github.com/openai-oss-forks/tokio-tungstenite",
    "https://github.com/openai-oss-forks/tungstenite-rs",
    "https://github.com/transact-rs/sqlx",
]
