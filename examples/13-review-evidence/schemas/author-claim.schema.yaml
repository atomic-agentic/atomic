$schema: https://json-schema.org/draft/2020-12/schema
$id: https://atomic.example/schemas/author-claim-v1
title: AuthorClaim
description: >-
  Something the change author says about one check. Claims arrive in their own
  binding, never inside a host record: a claim is data to weigh, and a record is
  a result the host watched happen.
type: object
additionalProperties: false
required: [id, origin, criterion, claim, basis]
properties:
  id:
    type: string
    minLength: 4
    maxLength: 120
    description: The claim's own source ID, kept verbatim so a row can cite the claim it weighed.
  origin:
    type: string
    const: author
    description: Who said this. A claim is always the author's, never the host's.
  criterion:
    type: string
    minLength: 1
    maxLength: 60
    description: The check the author is speaking about.
  claim:
    type: string
    enum: [pass, fail]
    description: What the author says the result was.
  basis:
    type: string
    minLength: 1
    maxLength: 300
    description: The reason the author gives, treated as data.
