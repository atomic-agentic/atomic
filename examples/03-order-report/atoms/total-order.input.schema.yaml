$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
required: [order_id, lines]
properties:
  order_id:
    type: string
    minLength: 1
  lines:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [sku, quantity, unit_cents]
      properties:
        sku:
          type: string
          minLength: 1
        quantity:
          type: integer
          minimum: 1
          maximum: 10000
        unit_cents:
          type: integer
          minimum: 0
          maximum: 10000000
    minItems: 1
    maxItems: 100
