$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
required: [order_id, total_cents, note]
properties:
  order_id:
    type: string
    minLength: 1
  total_cents:
    type: integer
    minimum: 0
  note:
    type: string
    minLength: 1
    maxLength: 300
