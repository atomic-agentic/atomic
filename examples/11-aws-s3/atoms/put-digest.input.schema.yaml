$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
required: [key, text]
properties:
  key:
    type: string
    description: The object key to create. The bucket is fixed by the atom.
    pattern: "^digests/[A-Za-z0-9._-]+$"
    maxLength: 200
  text: { type: string, minLength: 1, maxLength: 20000 }
