$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
required:
- report
properties:
  report:
    type: object
    additionalProperties: false
    required:
    - text
    - bytes
    - sha256
    properties:
      text:
        type: string
      bytes:
        type: integer
        minimum: 0
      sha256:
        type: string
        pattern: ^[a-f0-9]{64}$
