$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
required: [decision, findings]
properties:
  decision:
    type: string
    enum: [ready, revise]
  findings:
    type: array
    maxItems: 12
    items:
      type: string
      minLength: 1
      maxLength: 300
