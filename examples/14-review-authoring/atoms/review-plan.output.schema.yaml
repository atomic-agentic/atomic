$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
required: [priority, steps]
properties:
  priority:
    type: string
    enum: [low, medium, high]
  steps:
    type: array
    minItems: 1
    maxItems: 12
    items:
      type: string
      minLength: 1
      maxLength: 300
