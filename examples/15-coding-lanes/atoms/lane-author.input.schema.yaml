$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
required: [task, base]
properties:
  task:
    type: object
    additionalProperties: false
    required: [title, guard]
    properties:
      title:
        type: string
        minLength: 1
        maxLength: 200
      guard:
        type: string
        minLength: 1
        maxLength: 400
        description: The behaviour the candidate must keep, stated as what its test refuses.
  base:
    type: string
    minLength: 40
    maxLength: 64
    description: The commit this attempt starts from, as its step's host-recorded base.
