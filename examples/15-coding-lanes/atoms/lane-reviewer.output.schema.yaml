$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
required: [verdict, findings]
properties:
  verdict:
    type: string
    enum: [approve, request_changes, escalate]
  findings:
    type: array
    minItems: 1
    maxItems: 30
    items:
      anyOf:
      - type: string
        minLength: 1
        maxLength: 500
      - type: object
        additionalProperties: false
        required: [file, line, severity, category, message]
        properties:
          file:
            type: string
            minLength: 1
            maxLength: 256
          line:
            type: integer
            const: 1
          severity:
            type: string
            enum: [minor, low, nit]
          category:
            type: string
            const: formatting
          message:
            type: string
            const: Remove the trailing space.
