$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
required: [verdict, reason, findings]
properties:
  verdict:
    type: string
    enum: [approve, request_changes, escalate]
  reason:
    type: string
    minLength: 1
    maxLength: 800
  findings:
    type: array
    minItems: 1
    maxItems: 30
    description: >-
      What this reviewer checked and what it could not, one line each. A verdict
      with nothing behind it is not one a person can decide on.
    items:
      type: string
      minLength: 1
      maxLength: 500
