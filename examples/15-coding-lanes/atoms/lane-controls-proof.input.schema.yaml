$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
required: [source, commit, bound, rows]
properties:
  source:
    type: string
    minLength: 1
    maxLength: 4096
    description: The private checkout the host gave this proof.
  commit:
    type: string
    minLength: 40
    maxLength: 64
  bound:
    type: object
    additionalProperties: false
    required: [reference, base, admitted]
    properties:
      reference:
        type: string
        minLength: 1
        maxLength: 200
      base:
        type: string
        minLength: 40
        maxLength: 64
      admitted:
        type: string
        minLength: 40
        maxLength: 64
  rows:
    type: array
    minItems: 1
    maxItems: 16
    items:
      type: string
      minLength: 1
      maxLength: 100
  row_seconds:
    type: integer
    minimum: 1
    maximum: 300
    description: >-
      The seconds one row may run, supplied by the host alongside the row. The
      host's own driver bounds and uses it; this illustration starts no
      subprocess, so it checks the value is one a real driver could have been
      given and runs no row with it.
