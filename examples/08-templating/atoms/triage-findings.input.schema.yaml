$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
required: [item, findings]
properties:
  item:
    type: object
    additionalProperties: false
    required: [id, title, criteria]
    properties:
      id:
        type: string
        minLength: 1
      title:
        type: string
        minLength: 1
        maxLength: 200
      criteria:
        type: array
        minItems: 1
        items:
          type: string
          minLength: 1
  findings:
    type: array
    items:
      $ref: https://atomic.example/schemas/finding-v1
