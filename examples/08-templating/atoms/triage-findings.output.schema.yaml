$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
required: [decision, must_fix, summary]
properties:
  decision:
    type: string
    enum: [fix_now, follow_up, accept]
  must_fix:
    type: array
    items:
      type: string
      minLength: 1
  summary:
    type: string
    minLength: 1
    maxLength: 300
