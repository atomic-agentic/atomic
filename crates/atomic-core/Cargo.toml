# SPDX-License-Identifier: Apache-2.0

[package]
name = "atomic-agentic-core"
description = "The Atom trait and the runtime that runs atoms on Codex. The only crate in atomic that depends on Codex."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# The short name code uses; the package name is the published one.
name = "atomic_core"

[lints]
workspace = true

[features]
# Named failpoints (failpoint::failpoint()) kill the process when
# ATOMIC_FAILPOINT names them; for crash tests only. Without the feature they
# do nothing.
failpoints = []
# The scripted fake model (atomic_core::testing), for other crates' tests.
fake-model = []
# ExecSandbox::reaching_loopback_for_tests, which lets a confined command
# reach this machine's loopback interface on any port, for the sandbox suites
# that serve on it. Never in a build that runs atoms.
exec-loopback-tests = []
# A test binary that links atomic-core serves as the Astro compiler's child
# process, as the atomic binary does, so other crates' tests can compile atoms
# in-process. For other crates' tests; never in a release build.
compiler-in-tests = ["dep:ctor"]

[dependencies]

# Use the native TSX converter without registering Node-API bindings in the binary.
astro2tsx = { git = "https://github.com/withastro/compiler-rs", rev = "c9bf179f77439e427a98751569d2af42ff85d78c" }
napi-derive = { version = "=3.5.2", features = ["noop"] }
# The Astro grammar used by upstream compiler-rs v0.5.3.
oxc_allocator = { git = "https://github.com/withastro/oxc", rev = "e5e100abf1afb9a79ae22f97de32befe4b925d5d" }
oxc_ast = { git = "https://github.com/withastro/oxc", rev = "e5e100abf1afb9a79ae22f97de32befe4b925d5d", features = ["serialize"] }
oxc_ast_visit = { features = ["serialize"], git = "https://github.com/withastro/oxc", rev = "e5e100abf1afb9a79ae22f97de32befe4b925d5d" }
oxc_parser = { git = "https://github.com/withastro/oxc", rev = "e5e100abf1afb9a79ae22f97de32befe4b925d5d", features = ["astro"] }
oxc_span = { git = "https://github.com/withastro/oxc", rev = "e5e100abf1afb9a79ae22f97de32befe4b925d5d" }

oxc_codegen = { git = "https://github.com/withastro/oxc", rev = "e5e100abf1afb9a79ae22f97de32befe4b925d5d" }
oxc_transformer = { git = "https://github.com/withastro/oxc", rev = "e5e100abf1afb9a79ae22f97de32befe4b925d5d" }
oxc_semantic = { git = "https://github.com/withastro/oxc", rev = "e5e100abf1afb9a79ae22f97de32befe4b925d5d" }
rayon = "1.12"
tsz-core = { git = "https://github.com/tsz-org/tsz", rev = "8d61983f4478726ebc57cbb4d0a09b156658f753" }
tsz-common = { git = "https://github.com/tsz-org/tsz", rev = "8d61983f4478726ebc57cbb4d0a09b156658f753" }

anyhow = { workspace = true }
dirs = { workspace = true }
globset = { workspace = true }
ignore = { workspace = true }
jsonschema = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
hyper-util = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
getrandom = { workspace = true }
libc = { workspace = true }
nix = { workspace = true }
psl = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "macros", "rt", "rt-multi-thread", "sync", "time"] }
atomic-schema = { workspace = true }
atomic-exec = { workspace = true }
codex-app-server = { workspace = true }
codex-core-api = { workspace = true }
codex-extension-api = { workspace = true }
codex-protocol = { workspace = true }
codex-network-proxy = { workspace = true }
boa_engine = { workspace = true }
ctor = { workspace = true, optional = true }
codex-keyring-store = { workspace = true }
codex-login = { workspace = true }
codex-process-hardening = { workspace = true }
url = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Package the service binary from the same locked Codex graph as atomic.exe.
codex-windows-sandbox-service = { workspace = true }
codex-windows-sandbox = { workspace = true }
codex-config = { workspace = true }
codex-core = { workspace = true }
dunce = "1"
windows-sys = { version = "0.61.2", features = ["Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }

[build-dependencies]
sha2 = { workspace = true }

[dev-dependencies]
ctor = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "rt-multi-thread", "macros", "sync"] }
codex-exec-server = { workspace = true }
codex-http-client = { workspace = true }
futures-util = "=0.3.34"
tokio-tungstenite = "=0.28.0"
tempfile = "=3.27.0"
