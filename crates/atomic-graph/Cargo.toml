# SPDX-License-Identifier: Apache-2.0

[package]
name = "atomic-agentic-graph"
description = "atomic's work graph: items, edges, claims and messages."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# The short name code uses; the package name is the published one.
name = "atomic_graph"

[lints]
workspace = true

[dependencies]
atomic-core = { package = "atomic-agentic-core", path = "../atomic-core" }
atomic-durable = { package = "atomic-agentic-durable", path = "../atomic-durable" }
chrono = "0.4"
jsonschema = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "sync"] }

# The model-tool regression uses core's scripted fake model and the local
# execution backend. The conformance suite remains std-only.
[dev-dependencies]
atomic-core = { package = "atomic-agentic-core", path = "../atomic-core", features = ["fake-model"] }
atomic-exec = { package = "atomic-agentic-exec", path = "../atomic-exec" }
