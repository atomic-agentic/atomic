# SPDX-License-Identifier: Apache-2.0

[package]
name = "atomic-agentic-schema"
description = "Schema registry, lowering to generation profiles, and full-contract validation for atomic."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# The short name code uses; the package name is the published one.
name = "atomic_schema"

[lints]
workspace = true

[dependencies]
cel = { workspace = true }
jsonschema = { workspace = true }
saphyr-parser = { workspace = true }
serde = { workspace = true }
# Key order follows the document, as in the atomic binary (where other crates
# enable it too); generated declarations list properties in authored order.
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
url = { workspace = true }

[dev-dependencies]
# Codex's crates turn on arbitrary-precision numbers in the atomic binary; the
# tests run with it too, so the JSON-to-CEL conversion is tested as it runs.
serde_json = { workspace = true, features = ["preserve_order", "arbitrary_precision"] }
