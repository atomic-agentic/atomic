# SPDX-License-Identifier: Apache-2.0

[package]
name = "atomic-agentic-durable"
description = "The DurableRuntime trait and its adapter: the only crate in atomic that talks to the durable-execution engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# The short name code uses; the package name is the published one.
name = "atomic_durable"

[lints]
workspace = true

[features]
# Named failpoints (failpoint()) kill the process when ATOMIC_FAILPOINT
# names them; for crash tests only. Without the feature they do nothing.
failpoints = ["dep:libc"]
# Run the Postgres variants of the tests against ATOMIC_TEST_DATABASE_URL.
# With this on, a missing database fails the tests instead of skipping them.
postgres-tests = []

[dependencies]
durare = { workspace = true }
getrandom = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# Postgres for the adapter's own reads of atomic's tables (durare brings the driver).
sqlx = { workspace = true, features = ["postgres"] }
thiserror = { workspace = true }
# How a failpoint kills its process (failpoints only).
libc = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
