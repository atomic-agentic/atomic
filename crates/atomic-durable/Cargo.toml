# SPDX-License-Identifier: Apache-2.0

[package]
name = "atomic-agentic-durable"
description = "The DurableRuntime trait and its adapter: the only crate in atomic that talks to the durable-execution engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Run the Postgres variants of the tests against ATOMIC_TEST_DATABASE_URL.
# With this on, a missing database fails the tests instead of skipping them.
postgres-tests = []

[dependencies]
durare = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
