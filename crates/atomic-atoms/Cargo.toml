[package]
name = "atomic-agentic-atoms"
description = "Built-in atoms for atomic."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# The short name code uses; the package name is the published one.
name = "atomic_atoms"

[lints]
workspace = true

[dependencies]
atomic-core = { workspace = true }
atomic-schema = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# The golden test runs every built-in atom against the scripted fake model.
atomic-core = { workspace = true, features = ["fake-model"] }
jsonschema = { workspace = true }
