# Staging: one replica, the release candidate.
include = common.conf

[service]
name = storefront-web-staging
image = ${registry}/storefront/web:2.15.0-rc1
registry = ${service.registry_host}

[deploy]
env = staging
replicas = 1

include = services/web.conf

[http]
; staging serves on its own port, after the shared settings
port = 8081
