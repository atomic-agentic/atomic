# SPDX-License-Identifier: Apache-2.0

[package]
name = "atomic-agentic"
description = "The atomic command-line program: workflows, the operator CLI and the server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Run the tests that need Codex's Linux sandbox (bubblewrap and unprivileged
# user namespaces). With this on, a sandbox that cannot start fails them.
sandbox-tests = []
# Run the tests that need PostgreSQL at ATOMIC_TEST_DATABASE_URL, here and
# in the durable store. With this on, a database that cannot be reached fails
# them; with it off, they are not built.
postgres-tests = ["atomic-durable/postgres-tests"]

[dependencies]
tokio = { workspace = true, features = ["rt", "signal", "macros"] }
anyhow = { workspace = true }
getrandom = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
atomic-atoms = { workspace = true }
atomic-core = { workspace = true }
atomic-durable = { workspace = true }
atomic-exec = { workspace = true }
atomic-graph = { workspace = true }
atomic-schema = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }

[dev-dependencies]
opentelemetry_sdk = { workspace = true, features = ["testing"] }
atomic-core = { workspace = true, features = ["fake-model", "failpoints"] }
atomic-durable = { workspace = true, features = ["failpoints"] }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time"] }

[lib]
# Workflows written in Rust, which the binary and its tests share.
name = "atomic_app"
path = "src/lib.rs"

[[bin]]
name = "atomic"
path = "src/main.rs"
