[package]
name = "atomic-agentic"
description = "The atomic command-line program: workflows, the operator CLI and the server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
tokio = { workspace = true, features = ["rt"] }
anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
atomic-atoms = { workspace = true }
atomic-core = { workspace = true }
atomic-durable = { workspace = true }
atomic-exec = { workspace = true }
atomic-graph = { workspace = true }
atomic-schema = { workspace = true }

[dev-dependencies]
sqlx = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }

[[bin]]
name = "atomic"
path = "src/main.rs"
