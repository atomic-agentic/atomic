# SPDX-License-Identifier: Apache-2.0

[package]
name = "atomic-agentic"
description = "The atomic command-line program: workflows, the operator CLI and the server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Run the tests that need Codex's Linux sandbox (bubblewrap and unprivileged
# user namespaces). With this on, a sandbox that cannot start fails them.
sandbox-tests = []

[dependencies]
tokio = { workspace = true, features = ["rt"] }
anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
atomic-atoms = { workspace = true }
atomic-core = { workspace = true }
atomic-durable = { workspace = true }
atomic-exec = { workspace = true }
atomic-graph = { workspace = true }
atomic-schema = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
atomic-core = { workspace = true, features = ["fake-model"] }
atomic-durable = { workspace = true, features = ["failpoints"] }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time"] }

[lib]
# Workflows written in Rust, which the binary and its tests share.
name = "atomic_app"
path = "src/lib.rs"

[[bin]]
name = "atomic"
path = "src/main.rs"
