# Crates where atomic's Cargo.lock differs from Codex's Cargo.lock at the pinned
# revision, each with the reason. Cargo.lock starts from Codex's lockfile, so
# everything Codex builds resolves to the versions Codex tested; these are the
# differences atomic's own dependencies force. scripts/lock-check.sh fails on
# any difference not listed here, and on a listed one that no longer occurs.

