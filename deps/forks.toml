# Every fork atomic's build uses, with its pinned revision. This file is the
# source for the third-party notices and the release SBOM, and
# scripts/forks-check.sh checks it against Cargo.lock.
#
# Each [[fork]] lists the crates that must resolve from `repository` at `rev`.

[[fork]]
name = "durare"
repository = "https://github.com/atomic-agentic/durare"
upstream = "https://github.com/SamuelXing/durare"
# The upstream commit the fork's `atomic` branch starts from.
upstream_base = "0994da0d6425c575ad4192353399c0eb8085b68a"
branch = "atomic"
rev = "51e19b5068f1ececcc9599d8bfc2a04157ff7f10"
licence = "MIT OR Apache-2.0"
why = "ported to sqlx 0.9 so it links with Codex's SQLite stack; SQLite write steps begin IMMEDIATE; recovery survives transient storage outages, PostgreSQL-only builds work and receive deadlines persist; shutdown aborts and joins tasks left after the drain deadline"
crates = ["durare", "durare-macros"]

[[fork]]
name = "sqlx"
repository = "https://github.com/transact-rs/sqlx"
upstream = "https://github.com/launchbadge/sqlx"
rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c"
licence = "MIT OR Apache-2.0"
why = "accepts libsqlite3-sys 0.39; Codex patches sqlx-core and sqlx-sqlite to it, atomic adds sqlx-postgres"
crates = ["sqlx-core", "sqlx-sqlite", "sqlx-postgres"]

[[fork]]
name = "codex"
repository = "https://github.com/atomic-agentic/codex"
upstream = "https://github.com/openai/codex"
# The upstream release commit the fork's pin branch starts from (deps/codex.toml's tag).
upstream_base = "d32063f96c2dff1dc96af839b3952abb6acfeda4"
branch = "atomic"
rev = "f08195033e1e1585b9a7c6fd0b9d0e068c18a726"
licence = "Apache-2.0"
why = "makes parent-death signalling best effort where prctl is refused, rejects redirects for configured-key model requests, and bounds direct proxy dials"
crates = ["codex-app-server", "codex-core-api", "codex-extension-api", "codex-model-provider", "codex-model-provider-info", "codex-network-proxy", "codex-utils-pty"]

[[fork]]
name = "astro-oxc"
repository = "https://github.com/withastro/oxc"
upstream = "https://github.com/oxc-project/oxc"
rev = "e5e100abf1afb9a79ae22f97de32befe4b925d5d"
licence = "MIT"
why = "the Astro grammar pinned by compiler-rs v0.5.3"
crates = ["oxc_allocator", "oxc_ast", "oxc_ast_macros", "oxc_ast_visit", "oxc_data_structures", "oxc_diagnostics", "oxc_ecmascript", "oxc_estree", "oxc_parser", "oxc_regular_expression", "oxc_span", "oxc_str", "oxc_syntax"]
