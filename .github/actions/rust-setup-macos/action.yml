# SPDX-License-Identifier: Apache-2.0

name: Rust setup (macOS)
description: Pinned Rust toolchain for macOS jobs

runs:
  using: composite
  steps:
    # rustup installs the toolchain and components rust-toolchain.toml names.
    - name: Toolchain
      shell: bash
      run: rustup show active-toolchain || rustup toolchain install
