# SPDX-License-Identifier: Apache-2.0
#
# CodeQL code scanning of atomic's Rust and of these workflow files. Results
# appear under Security > Code scanning. GitHub's default setup cannot scan
# Rust, so this is an advanced setup; leave default setup off, since the two
# cannot both upload. Rust is extracted from source (build mode "none"), so no
# build runs here. Actions are pinned by commit SHA.
#
# It scans main (each push, a weekly run and a run started by hand), not each
# pull request: CI's runners are shared, and a scan per push to every open
# pull request kept the merge queue's own checks waiting. An alert therefore
# appears after its change merges; fix it on main, never dismiss it.

name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_NET_RETRY: "10"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: rust
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain
        if: matrix.language == 'rust'
        run: rustup show active-toolchain || rustup toolchain install

      # The extractor's cargo resolves the whole graph, which fetches the
      # Codex git sources and rusty_v8's Chromium submodules: restore them
      # from the cache CI's Clippy job saves on main (see
      # .github/actions/rust-setup, whose paths and key this matches). It is
      # never saved from here, and a miss only fetches them again. Nothing
      # here waits for CI, nor CI for this.
      - name: Restore cargo's downloads
        if: matrix.language == 'rust'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-home-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-home-${{ runner.os }}-

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
