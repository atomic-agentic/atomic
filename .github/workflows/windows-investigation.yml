# SPDX-License-Identifier: Apache-2.0
name: Windows archive diagnostics
on:
  push:
    branches: ['impl/v02-windows-amd64']
    paths:
      - 'scripts/windows-release-smoke.py'
      - '.github/workflows/windows-investigation.yml'
permissions:
  actions: read
  contents: read
jobs:
  smoke:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: atomic-x86_64-pc-windows-msvc
          run-id: 45556476302
          github-token: ${{ github.token }}
          path: dist
      - name: Inspect the packaged coding turn
        shell: bash
        run: python scripts/windows-release-smoke.py dist/*.zip dist/*.cdx.json
