# SPDX-License-Identifier: Apache-2.0
#
# A dry run of a Codex bump. Codex's internal API has no stability promise, so
# atomic moves to a new Codex release on a schedule, and this workflow says
# what that move would break before anyone makes it:
#
# 1. the durare fork is rebuilt and tested against the candidate Codex's sqlx
#    and toolchain, since atomic's graph has to unify with both;
# 2. atomic is built at the candidate and every milestone suite runs; the job
#    summary is a table of which pass (scripts/milestone-tests.sh).
#
# The candidate is the pin committed on a codex-bump/<tag> branch (made with
# scripts/codex-bump.sh), or, on the monthly schedule or a manual run, the tag
# given or Codex's latest release, applied in the job itself. Nothing here
# commits or opens a pull request.

name: Codex bump

on:
  push:
    branches: ["codex-bump/**"]
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Codex release tag to try (default, the latest release)
        required: false

concurrency:
  group: codex-bump-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_NET_RETRY: "10"

jobs:
  candidate:
    name: Candidate
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # Empty on a codex-bump branch: the branch's committed pin is the candidate.
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT: ${{ github.event.inputs.tag }}
        run: |
          tag=""
          if [ "${GITHUB_EVENT_NAME}" != "push" ]; then
            tag="${INPUT:-$(gh api repos/openai/codex/releases/latest --jq .tag_name)}"
          fi
          echo "tag=${tag}" >>"${GITHUB_OUTPUT}"
          echo "Candidate: ${tag:-the pin committed on ${GITHUB_REF_NAME}}" >>"${GITHUB_STEP_SUMMARY}"

  durare:
    name: durare fork at the candidate
    needs: candidate
    runs-on: ubuntu-24.04
    outputs:
      result: ${{ steps.test.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Apply the candidate
        if: needs.candidate.outputs.tag != ''
        run: scripts/codex-bump.sh "${{ needs.candidate.outputs.tag }}"
      - name: Read the pins
        id: pins
        run: |
          fork_rev="$(awk '/^\[\[fork\]\]/ { f = 0 } /^name = "durare"/ { f = 1 } f && /^rev = / { gsub(/"/, "", $3); print $3; exit }' deps/forks.toml)"
          sqlx_rev="$(sed -n 's/^sqlx-core = { git = "https:\/\/github.com\/transact-rs\/sqlx", rev = "\([0-9a-f]*\)".*/\1/p' Cargo.toml | head -n1)"
          toolchain="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          echo "fork_rev=${fork_rev}" >>"${GITHUB_OUTPUT}"
          echo "sqlx_rev=${sqlx_rev}" >>"${GITHUB_OUTPUT}"
          echo "toolchain=${toolchain}" >>"${GITHUB_OUTPUT}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: atomic-agentic/durare
          ref: ${{ steps.pins.outputs.fork_rev }}
          path: durare
      # The fork patches sqlx to the same source Codex does; move it to the
      # candidate's revision.
      - name: Point the fork at the candidate's sqlx
        working-directory: durare
        run: |
          sed -i '/git = "https:\/\/github.com\/transact-rs\/sqlx"/s/rev = "[0-9a-f]*"/rev = "${{ steps.pins.outputs.sqlx_rev }}"/' Cargo.toml
          git diff --stat
      - name: Toolchain
        run: rustup toolchain install "${{ steps.pins.outputs.toolchain }}" --profile minimal
      - name: Build and test
        id: test
        working-directory: durare
        run: cargo "+${{ steps.pins.outputs.toolchain }}" test
      - name: Report
        if: always()
        run: |
          {
            echo "### durare fork"
            echo
            echo "Fork ${{ steps.pins.outputs.fork_rev }} with sqlx ${{ steps.pins.outputs.sqlx_rev }} on Rust ${{ steps.pins.outputs.toolchain }}: **${{ steps.test.outcome }}**"
          } >>"${GITHUB_STEP_SUMMARY}"

  milestones:
    name: Milestone suites at the candidate
    needs: [candidate, durare]
    # Report the milestones even when the fork fails, so one run shows both.
    if: always() && needs.candidate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Apply the candidate
        if: needs.candidate.outputs.tag != ''
        run: scripts/codex-bump.sh "${{ needs.candidate.outputs.tag }}"

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: System packages
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libcap-dev libssl-dev libdbus-1-dev

      - name: Test Postgres
        run: |
          docker run -d --name atomic-test-postgres -p 127.0.0.1:5432:5432 \
            -e POSTGRES_USER=atomic -e POSTGRES_PASSWORD=atomic -e POSTGRES_DB=atomic \
            postgres:18.7-trixie@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
          for _ in $(seq 1 60); do
            docker exec atomic-test-postgres pg_isready -q -h 127.0.0.1 -U atomic && break
            sleep 1
          done
          echo "ATOMIC_TEST_DATABASE_URL=postgres://atomic:atomic@127.0.0.1:5432/atomic" >>"$GITHUB_ENV"

      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # Codex's lockfile lacks atomic's own packages; resolving adds them at
      # the versions Codex's lockfile allows. The result is kept for the bump
      # commit.
      - name: Complete the lockfile
        run: cargo metadata --format-version 1 >/dev/null

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Cargo.lock
          path: Cargo.lock

      - name: Pins
        id: pins
        continue-on-error: true
        run: |
          scripts/codex-pin.sh check
          scripts/forks-check.sh
          scripts/lock-check.sh

      - name: Milestone suites
        run: scripts/milestone-tests.sh

      - name: Report the pin checks
        if: always()
        run: |
          echo >>"${GITHUB_STEP_SUMMARY}"
          echo "Pin checks (codex-pin, forks, lockfile): **${{ steps.pins.outcome }}**" >>"${GITHUB_STEP_SUMMARY}"
