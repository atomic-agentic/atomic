# SPDX-License-Identifier: Apache-2.0
#
# Controls are tested by removing them (docs/development.md). On every pull
# request this runs the controls rows the pull request touches: each row whose
# row file, switched file or guarding test it changes
# (scripts/controls-touched.py). The rows run in parallel shards, each a job
# that builds once and runs its rows in turn with scripts/controls-check.sh,
# which switches the control off, requires its tests to fail, puts it back and
# requires them to pass. "Controls" passes only when every row passed.
#
# A merge group runs no rows. Once "Controls" is a required check, a pull
# request can join the queue only after its rows passed on it, and running
# them again would double the queue's wait. A weekly run on main, and a run
# started by hand, sweep every row instead, so that what changes no row
# (combinations of changes, lockfile and pin bumps) is still checked.
# Actions are pinned by commit SHA.

name: Controls

on:
  pull_request:
  merge_group:
  schedule:
    - cron: "17 5 * * 0"
  workflow_dispatch:

concurrency:
  group: controls-${{ github.event_name }}-${{ github.ref }}
  # A newer run on a pull request or a merge group makes its older run moot;
  # a sweep runs to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

permissions:
  contents: read

env:
  # Plain text in the logs, which scripts/controls-check.sh reads.
  CARGO_TERM_COLOR: never
  # A row rebuilds its crate twice, once with the control off and once with it
  # back, so the workspace's own crates build incrementally here.
  CARGO_INCREMENTAL: "1"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_NET_RETRY: "10"
  # How the rows are cut into shards: one for every ROWS_PER_SHARD rows, up to
  # MAX_SHARDS for a pull request (a change to codex.rs touches about a
  # hundred rows) and SWEEP_SHARDS for a sweep of every row.
  ROWS_PER_SHARD: "6"
  MAX_SHARDS: "12"
  SWEEP_SHARDS: "16"

jobs:
  plan:
    name: Touched controls
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      count: ${{ steps.plan.outputs.count }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: plan
        name: The rows to run
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail
          summary="${GITHUB_STEP_SUMMARY}"
          case "${EVENT}" in
          merge_group)
            echo "A merge group runs no rows. Its pull request's own Controls run checked them; once Controls is a required check, a pull request joins the queue only after that run passed." | tee -a "${summary}"
            echo "count=0" >>"${GITHUB_OUTPUT}"
            exit 0
            ;;
          pull_request)
            # A pull request's checkout is its merge onto the base branch, so
            # the change is what that merge adds to its first parent.
            git rev-parse --verify --quiet HEAD^2 >/dev/null ||
              { echo "::error::HEAD is not the pull request's merge commit"; exit 1; }
            base="$(git rev-parse HEAD^1)"
            range=("${base}" HEAD)
            most="${MAX_SHARDS}"
            if ! git diff --quiet "${base}" HEAD -- scripts/controls-local.txt; then
              echo "::warning::this pull request changes scripts/controls-local.txt, the rows CI does not run; say why in its description"
            fi
            ;;
          *)
            range=(--all HEAD)
            most="${SWEEP_SHARDS}"
            ;;
          esac
          rows="$(scripts/controls-touched.py "${range[@]}")" || exit 1
          # A sweep reports the rows it leaves out too, so none is skipped
          # without a word.
          report="$(scripts/controls-touched.py "${range[@]}" --report)" || exit 1
          count="$(grep -c . <<<"${rows}" || true)"
          shards=$(( (count + ROWS_PER_SHARD - 1) / ROWS_PER_SHARD ))
          [ "${shards}" -le "${most}" ] || shards="${most}"
          matrix="[]"
          for i in $(seq 1 "${shards}"); do
            names="$(scripts/controls-touched.py "${range[@]}" --shards "${shards}" --shard "${i}" | paste -sd' ')" || exit 1
            [ -n "${names}" ] || { echo "::error::shard ${i} of ${shards} holds no row"; exit 1; }
            matrix="$(jq -c --argjson i "${i}" --argjson of "${shards}" --arg rows "${names}" '. + [{shard: $i, of: $of, rows: $rows}]' <<<"${matrix}")"
          done
          {
            echo "### Controls rows"
            echo
            echo "Rows to run: ${count}. Shards: ${shards}."
            if [ -n "${report}" ]; then
              echo
              echo '```'
              echo "${report}"
              echo '```'
            fi
          } >>"${summary}"
          # Each row CI leaves to a local run, and each deleted row, is
          # flagged on the pull request.
          while IFS= read -r line; do
            [ -z "${line}" ] || echo "::warning::${line}"
          done <<<"${report}"
          echo "count=${count}" >>"${GITHUB_OUTPUT}"
          echo "matrix={\"include\":${matrix}}" >>"${GITHUB_OUTPUT}"

  # Each shard is set up as the test jobs are, with Postgres and the user
  # namespaces the sandbox tests need, so the sandbox rows run here too.
  shard:
    name: Controls (${{ matrix.shard }}/${{ matrix.of }})
    needs: plan
    if: ${{ needs.plan.outputs.count != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
        with:
          target-cache: test
          backends: "true"
      # rusty_v8's build script lays its prebuilt archive and bindings outside
      # its own output, in target/debug/gn_out/ and its crate's source, and the
      # build cache keeps neither, so a row built with other features than
      # the cached build, which compiles v8 again, finds no archive to link.
      # Forgetting v8's units makes its build script run again, from the
      # verified mirror rust-setup laid out, before any row builds.
      - name: V8's build output for every feature set
        run: rm -rf target/debug/build/v8-* target/debug/.fingerprint/v8-*
      - name: Pin SQLite-capable bd for the ready JSON differential control
        if: ${{ contains(matrix.rows, 'graph-ready-json-comment-count') }}
        run: |
          bd_bin="$(scripts/bd-sqlite-pin.sh "${RUNNER_TEMP}/atomic-bd-sqlite")"
          echo "ATOMIC_TEST_BD_SQLITE_BIN=${bd_bin}" >>"${GITHUB_ENV}"
      - name: Run the rows
        # Under the job's limit, so the summary below still runs.
        timeout-minutes: 290
        env:
          ROWS: ${{ matrix.rows }}
          # The runner's /tmp belongs to this job alone, as in the test jobs.
          ATOMIC_TEST_PRIVATE_TMP: "1"
        run: |
          set -uo pipefail
          set -f
          results="${RUNNER_TEMP}/results.txt"
          : >"${results}"
          [ -n "${ROWS}" ] || { echo "::error::this shard was given no row"; exit 1; }
          status=0
          for row in ${ROWS}; do
            echo "::group::${row}"
            code=0
            # A row that hangs is stopped, and its files put back, rather than
            # taking the rest of the shard with it.
            timeout --kill-after=60s 45m scripts/controls-check.sh "${row}" 2>&1 | tee "${RUNNER_TEMP}/row.log" || code=$?
            echo "::endgroup::"
            line="$(grep -E "^(ok|FAIL) ${row}: " "${RUNNER_TEMP}/row.log" | tail -n 1)"
            # A row passes only on a clean exit with its ok line; any other
            # end is a FAIL line, the script's own when it gave one.
            if [ "${code}" -ne 0 ]; then
              case "${line}" in
              "FAIL "*) ;;
              *) line="FAIL ${row}: scripts/controls-check.sh exited ${code}${line:+ after: ${line}}" ;;
              esac
            else
              case "${line}" in
              "ok ${row}: "*) ;;
              *) line="FAIL ${row}: scripts/controls-check.sh exited 0 without its ok line" ;;
              esac
            fi
            # Written as each row ends, so a shard stopped part way still
            # shows the rows it finished.
            echo "${line}" >>"${results}"
            case "${line}" in
            "FAIL "*) echo "::error::${line}"; status=1 ;;
            *) echo "${line}" ;;
            esac
          done
          exit "${status}"
      - name: Summary
        if: ${{ always() }}
        env:
          ROWS: ${{ matrix.rows }}
          SHARD: ${{ matrix.shard }}/${{ matrix.of }}
        run: |
          set -uf
          results="${RUNNER_TEMP}/results.txt"
          {
            echo "### Controls, shard ${SHARD}"
            echo
            echo '```'
            [ ! -f "${results}" ] || cat "${results}"
            finished=" $(cut -d' ' -f2 "${results}" 2>/dev/null | tr -d : | paste -sd' ') "
            for row in ${ROWS}; do
              case "${finished}" in *" ${row} "*) ;; *) echo "FAIL ${row}: not run, as the shard stopped first" ;; esac
            done
            echo '```'
          } >>"${GITHUB_STEP_SUMMARY}"
      - name: Keep the failing rows' cargo output
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: controls-logs-${{ matrix.shard }}
          path: target/controls-check-*.log
          if-no-files-found: ignore
          retention-days: 7

  # The one check that stands for the shards, which pass or fail as a set.
  controls:
    name: Controls
    # always(), not !cancelled(): a cancelled run must end this check as a
    # failure, not as skipped, which a required check would count as passed.
    if: ${{ always() }}
    needs: [plan, shard]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every touched row passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"${NEEDS}"
          # No rows: the plan passed and the shards were skipped. Otherwise
          # both passed.
          jq -e '.plan.result == "success" and (.shard.result == "success" or (.shard.result == "skipped" and .plan.outputs.count == "0"))' <<<"${NEEDS}" >/dev/null
