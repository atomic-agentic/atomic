# SPDX-License-Identifier: Apache-2.0
#
# A version tag (v<version>, equal to the atomic-agentic package's version)
# builds the atomic binary for Linux, macOS and Windows, packages each with its licences
# and its CycloneDX SBOM, signs each archive and SBOM with Sigstore (keyless,
# under this workflow's GitHub OIDC identity), and attaches them with their
# signature bundles to a draft GitHub release for a maintainer to publish. A
# manual run on any branch does the same build, packaging and signing and keeps
# the results as workflow artifacts, with no release. Nothing else starts it:
# manual runs can select just Windows. Actions are pinned by commit SHA.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      windows_only:
        description: Build and smoke-test the Windows archive only
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_NET_RETRY: "10"

jobs:
  build:
    name: Build (${{ matrix.target }})
    if: ${{ !inputs.windows_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            cyclonedx_sha256: 2e4ef64a53c0a38d4b7d805c593b5f47ecd29821e98d81e484d03abaa0edb95f
          - os: macos-15
            target: aarch64-apple-darwin
            cyclonedx_sha256: 4c39e13494d51c9d7f63e2923e7afdb5648a7a806a9ed7684dbe3786d2e2d1da
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libcap-dev libssl-dev libdbus-1-dev

      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: The tag names the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(cargo pkgid -p atomic-agentic)"
          version="${version##*@}"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match atomic-agentic ${version}" >&2
            exit 1
          fi

      - name: cargo-cyclonedx
        run: |
          cdx="cargo-cyclonedx-${{ matrix.target }}"
          curl -fsSLo "${RUNNER_TEMP}/cdx.tar.xz" \
            "https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-0.5.10/${cdx}.tar.xz"
          echo "${{ matrix.cyclonedx_sha256 }}  ${RUNNER_TEMP}/cdx.tar.xz" | shasum -a 256 -c -
          # Not ~/.cargo/bin: the macOS runners keep cargo elsewhere.
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xJf "${RUNNER_TEMP}/cdx.tar.xz" -C "${RUNNER_TEMP}/bin" --strip-components=1 "${cdx}/cargo-cyclonedx"
          echo "${RUNNER_TEMP}/bin" >>"${GITHUB_PATH}"

      # Release builds start from a clean target directory; only cargo's
      # download caches are kept, for the large Codex git sources.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-release-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-release-${{ runner.os }}-

      # The checkout and cargo-home paths are remapped so the binary does not
      # carry this runner's directory layout.
      - name: Build
        run: |
          export RUSTFLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=/atomic --remap-path-prefix=${CARGO_HOME:-${HOME}/.cargo}=/cargo"
          cargo build --release --locked -p atomic-agentic --target ${{ matrix.target }}

      - name: The binary runs
        run: target/${{ matrix.target }}/release/atomic --version

      - name: Package
        run: scripts/release-package.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atomic-${{ matrix.target }}
          path: target/dist/*
          if-no-files-found: error

  windows:
    name: Build (Windows AMD64)
    runs-on: windows-2025
    timeout-minutes: 150
    env:
      WINDOWS_TARGET: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve pinned source bytes and allow long paths
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure the x64 MSVC environment
        shell: pwsh
        run: |
          $finder = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $finder -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'MSVC x64 tools are required' }
          $before = @{}
          Get-ChildItem Env: | ForEach-Object { $before[$_.Name] = $_.Value }
          & "$vs\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          $linker = Join-Path $env:VCToolsInstallDir 'bin/Hostx64/x64/link.exe'
          if (!(Test-Path -LiteralPath $linker -PathType Leaf)) { throw "Missing MSVC linker at $linker" }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" >> $env:GITHUB_ENV
          Get-ChildItem Env: | Where-Object { $before[$_.Name] -cne $_.Value } | ForEach-Object {
            if ($_.Name -eq 'PATH') {
              $_.Value.Split(';') | Where-Object { $_ -and $_ -notin $before['PATH'].Split(';') } >> $env:GITHUB_PATH
            } else {
              "$($_.Name)=$($_.Value)" >> $env:GITHUB_ENV
            }
          }

      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: The tag names the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(cargo pkgid -p atomic-agentic)"
          version="${version##*@}"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match atomic-agentic ${version}" >&2
            exit 1
          fi

      - name: cargo-cyclonedx
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP cdx.zip
          $bin = Join-Path $env:RUNNER_TEMP cyclonedx
          Invoke-WebRequest "https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-0.5.10/cargo-cyclonedx-${{ env.WINDOWS_TARGET }}.zip" -OutFile $archive
          if ((Get-FileHash $archive).Hash -ne 'b0cdf58875a4b3c83e13fbea19eb6a85d63498aeab90f50456179173c370b3ce') { throw 'cargo-cyclonedx checksum mismatch' }
          Expand-Archive $archive $bin
          $exe = @(Get-ChildItem $bin -Recurse -Filter cargo-cyclonedx.exe)
          if ($exe.Count -ne 1) { throw 'Expected one cargo-cyclonedx.exe' }
          $exe[0].DirectoryName >> $env:GITHUB_PATH

      # Release builds start from a clean target directory; only cargo's
      # download caches are kept, for the large Codex git sources.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-release-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-release-${{ runner.os }}-

      # The checkout and cargo-home paths are remapped so the binary does not
      # carry this runner's directory layout.
      - name: Build
        shell: pwsh
        env:
          CFLAGS_x86_64_pc_windows_msvc: -DCURL_ENABLE_NTLM
          LIBSQLITE3_FLAGS: SQLITE_DISABLE_INTRINSIC
        run: |
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE '.cargo' }
          $env:CARGO_ENCODED_RUSTFLAGS = @("--remap-path-prefix=$env:GITHUB_WORKSPACE=/atomic", "--remap-path-prefix=$cargoHome=/cargo", '-C', 'link-arg=/STACK:8388608', '-C', 'target-feature=+crt-static') -join [char]31
          cargo build --release --locked --target ${{ env.WINDOWS_TARGET }} `
            -p atomic-agentic -p codex-windows-sandbox -p codex-windows-sandbox-service `
            --bin atomic --bin codex-command-runner --bin codex-windows-sandbox-setup --bin codex-windows-sandbox-service

      - name: The binary runs
        run: target/${{ env.WINDOWS_TARGET }}/release/atomic.exe --version

      - name: Package
        run: scripts/release-package.sh ${{ env.WINDOWS_TARGET }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atomic-${{ env.WINDOWS_TARGET }}
          path: target/dist/*
          if-no-files-found: error

  windows-smoke:
    name: Exercise Windows release on a fresh machine
    needs: windows
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Preserve fixture bytes
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: atomic-x86_64-pc-windows-msvc
          path: dist

      - name: Test the extracted Windows release
        shell: bash
        run: python scripts/windows-release-smoke.py dist/*.zip dist/*.cdx.json

  # Signing runs in a job of its own, so the OIDC token that signs is never
  # available to the build, its build scripts or its dependencies.
  sign:
    name: Sign
    needs: [build, windows, windows-smoke]
    if: >-
      ${{ !cancelled() && needs.windows-smoke.result == 'success' &&
          (needs.build.result == 'success' || (inputs.windows_only && needs.build.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    env:
      COSIGN_VERSION: 3.1.4
      COSIGN_SHA256: 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: atomic-*
          path: dist
          merge-multiple: true

      - name: cosign
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -fsSLo "${RUNNER_TEMP}/bin/cosign" \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  ${RUNNER_TEMP}/bin/cosign" | sha256sum -c -
          chmod 0755 "${RUNNER_TEMP}/bin/cosign"
          echo "${RUNNER_TEMP}/bin" >>"${GITHUB_PATH}"

      # Each archive and SBOM gets a Sigstore bundle, <file>.sigstore.json,
      # holding its signature, the short-lived certificate for this
      # workflow's identity and the transparency log entry.
      - name: Sign
        working-directory: dist
        run: |
          shopt -s nullglob
          for f in *.tar.gz *.zip *.cdx.json; do
            [ -f "$f" ] || { echo "nothing to sign: $f" >&2; exit 1; }
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      # What a user runs, as docs/getting-started/installation.md describes,
      # against the identity this workflow must have signed with: this
      # repository's release.yml at this run's ref and commit. A signing step
      # that signed nothing, or signed as anyone else, fails here.
      - name: Verify
        working-directory: dist
        env:
          WINDOWS_ONLY: ${{ inputs.windows_only }}
        run: |
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          # Require one archive and one SBOM per target.
          targets=(x86_64-pc-windows-msvc)
          if [[ "$WINDOWS_ONLY" != true ]]; then targets+=(x86_64-unknown-linux-gnu aarch64-apple-darwin); fi
          shopt -s nullglob
          for target in "${targets[@]}"; do
            archive=tar.gz
            if [[ "$target" == x86_64-pc-windows-msvc ]]; then archive=zip; fi
            for kind in "$archive" cdx.json; do
              set -- atomic-*-"${target}.${kind}"
              [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "expected one atomic-*-${target}.${kind}, found: $*" >&2; exit 1; }
            done
          done
          for f in *.tar.gz *.zip *.cdx.json; do
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity "${identity}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-github-workflow-repository "${GITHUB_REPOSITORY}" \
              --certificate-github-workflow-sha "${GITHUB_SHA}" \
              "$f"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atomic-signatures
          path: dist/*.sigstore.json
          if-no-files-found: error

  release:
    name: Draft release
    needs: [build, windows, sign]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Check the checksums and signatures
        working-directory: dist
        run: |
          for f in *.sha256; do sha256sum -c "$f"; done
          for f in *.tar.gz *.zip *.cdx.json; do
            [ -f "$f.sigstore.json" ] || { echo "no signature bundle for $f" >&2; exit 1; }
          done
          cat *.sha256 | sort -k2 > SHA256SUMS

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --draft --verify-tag \
            --title "atomic ${GITHUB_REF_NAME}" --notes "" \
            dist/*.tar.gz dist/*.zip dist/*.cdx.json dist/*.sigstore.json dist/SHA256SUMS
