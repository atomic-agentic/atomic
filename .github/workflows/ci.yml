# SPDX-License-Identifier: Apache-2.0
#
# Linux and macOS are first-class platforms. Every push to main, every pull
# request and every merge group of the merge queue runs the checks on Linux.
# macOS is opt-in while atomic is built out:
# start the workflow by hand (Actions > CI > Run workflow) and tick "macos" to
# add it. Actions are pinned by commit SHA.
#
# The Linux Rust checks are split into jobs that run at once, so a pull
# request waits for the slowest of them rather than for their sum;
# docs/development.md ("Continuous integration") describes them and their
# build caches.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue builds each queued pull request on top of main, and
  # merges it only when these checks pass there.
  merge_group:
  workflow_dispatch:
    inputs:
      macos:
        description: Also run the Rust job on macOS
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  # A newer run on a pull request or a merge group makes its older run moot.
  # A run on main is the check of what main holds, and it saves the caches,
  # so once started it runs to the end.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Codex's patch block pulls rusty_v8 and its Chromium submodules; cargo's
  # built-in git client has failed on those fetches on macOS runners, and the
  # git command line is sturdier.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_NET_RETRY: "10"

jobs:
  codex-pin:
    name: Pins
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Fails when the [patch] block in Cargo.toml or rust-toolchain.toml drifts from the
      # Codex revision in deps/codex.toml.
      - run: python3 scripts/check-authoring-assets.py
      - run: scripts/codex-pin.sh check
      # Fails when a fork in deps/forks.toml resolves from another revision.
      - run: scripts/forks-check.sh
      # Fails when a crate shared with Codex leaves Codex's locked version
      # without a reason in deps/lock-exceptions.toml.
      - run: scripts/lock-check.sh
      # The V8 rule in lock-check against small lockfiles.
      - run: scripts/lock-check-test.sh
      # Fails when a control is switched off in the commit: every row's switch
      # text is in the file it names exactly once, and a replacement that holds
      # its own switch text is not in that file at all, on the lines the row
      # wrote it on or on any others.
      - run: python3 scripts/controls-on.py
      # controls-check.sh restores the source it edits, and refuses what it
      # cannot do safely; tested with a stand-in for cargo.
      - run: scripts/controls-check-test.sh
      # controls-touched.py, which picks the rows the Controls workflow runs,
      # in throwaway repositories.
      - run: scripts/controls-touched-test.sh
      # setup-deno.py retries a transient download failure, within a bound,
      # and refuses an archive that does not match its pin; against a
      # stand-in server on loopback.
      - run: python3 scripts/setup-deno-test.py
      - run: scripts/backends-check-audit-test.sh
      # acceptance.py fails on a listed test that failed or did not run.
      - run: scripts/acceptance-test.sh
      # test-shards.py fails on a test target in no shard, or in two, and on
      # a test the shards miss; cache-trim.py keeps only dependencies.
      - run: scripts/test-shards-test.sh
      # release-package.sh refuses a binary with failpoints compiled in.
      - run: scripts/release-package-test.sh
      # The catalog checker reads only a lockfile the project holds, whichever
      # of its three settings names it. Tested on inert fixtures.
      - run: python3 tools/deno_exec_test.py
      # The catalog checker reads a schema's plain value through this port of
      # atomic's scalar classifier, so it must say what the loader says. Tested on
      # spellings, and needing no YAML library, it runs where the catalog does not.
      - run: python3 tools/yaml_scalar_test.py

  # The Astro interpreter's own tests, and a rebuild of the bundled compiler
  # from its sources: the committed assets must be exactly what the sources
  # build, not only what the manifest says they are.
  authoring:
    name: Astro compiler
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test and rebuild in the pinned Node
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "${GITHUB_WORKSPACE}:/work" -w /work/authoring \
            node:24.21.0-trixie-slim@sha256:173f125896c3b47ddf056734c7ea789d04595a6a08769a8f78e0df642781fb66 \
            sh -c 'npm ci --ignore-scripts --no-audit --no-fund && node src/generate.mjs >/dev/null && node --test test/*.test.mjs && node src/build-worker.mjs'
      - name: The committed assets match the rebuild
        run: |
          git diff --exit-code -- crates/atomic-core/assets
          python3 scripts/check-authoring-assets.py

  # The example catalog against the proposed authoring contract, offline,
  # until atomic's own loader checks the same files.
  examples:
    name: Examples
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checker dependencies
        run: |
          python3 -m venv "${RUNNER_TEMP}/examples-venv"
          "${RUNNER_TEMP}/examples-venv/bin/pip" install --no-deps --require-hashes -r tools/requirements.txt
      - name: Pinned Astro compiler host
        run: |
          python3 scripts/setup-deno.py "${RUNNER_TEMP}/atomic-deno"
          echo "${RUNNER_TEMP}/atomic-deno" >>"${GITHUB_PATH}"
      - name: Check the examples
        working-directory: tools
        run: '"${RUNNER_TEMP}/examples-venv/bin/python" check_examples.py'

  # deny.toml: a dependency with a disallowed licence, a banned crate or an
  # unlisted source fails CI.
  deny:
    name: Dependency policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cargo-deny
        run: |
          deny=cargo-deny-0.21.0-x86_64-unknown-linux-musl
          curl -fsSLo "${RUNNER_TEMP}/deny.tar.gz" "https://github.com/EmbarkStudios/cargo-deny/releases/download/0.21.0/${deny}.tar.gz"
          echo "a2170b854ff697e79e39c4c538981c9c1bdd803addbae6719a4cb66b4585a903  ${RUNNER_TEMP}/deny.tar.gz" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "${RUNNER_TEMP}/deny.tar.gz" -C "${RUNNER_TEMP}/bin" --strip-components=1 "${deny}/cargo-deny"
          echo "${RUNNER_TEMP}/bin" >>"${GITHUB_PATH}"
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Licences, bans and sources
        run: cargo deny --locked check bans licenses sources

  # Advisories reach atomic through Codex's dependency tree and change daily,
  # so they are reported in a job of their own rather than mixed into the
  # policy check above.
  advisories:
    name: Advisories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cargo-deny
        run: |
          deny=cargo-deny-0.21.0-x86_64-unknown-linux-musl
          curl -fsSLo "${RUNNER_TEMP}/deny.tar.gz" "https://github.com/EmbarkStudios/cargo-deny/releases/download/0.21.0/${deny}.tar.gz"
          echo "a2170b854ff697e79e39c4c538981c9c1bdd803addbae6719a4cb66b4585a903  ${RUNNER_TEMP}/deny.tar.gz" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "${RUNNER_TEMP}/deny.tar.gz" -C "${RUNNER_TEMP}/bin" --strip-components=1 "${deny}/cargo-deny"
          echo "${RUNNER_TEMP}/bin" >>"${GITHUB_PATH}"
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo deny --locked check advisories

  # The Linux Rust checks run in parallel jobs, each set up by
  # .github/actions/rust-setup, which restores the build caches the last push
  # to main saved; on main, Clippy and "Acceptance and backends" save them
  # again. "Rust (ubuntu-24.04)" passes only when every one of these jobs
  # passes.
  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./.github/actions/rust-setup
        with:
          target-cache: check
          warm: "true"
          warm-downloads: "true"
      - run: cargo fmt --all --check
      - name: Clippy
        id: clippy
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The suites behind the test features (the crash suite, the sandbox and
      # Postgres variants) only compile with them.
      - name: Clippy with the test features
        id: clippy-features
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cargo clippy --workspace --all-targets --locked --features atomic-agentic/postgres-tests,atomic-agentic/sandbox-tests -- -D warnings
      # Only after both clippy passes, so that the cache saved under the
      # exact key, which no later run saves again, is complete.
      - name: Save the caches (main only)
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.clippy.outcome == 'success' && steps.clippy-features.outcome == 'success' }}
        uses: ./.github/actions/rust-cache-save
        with:
          setup: ${{ toJSON(steps.setup.outputs) }}
          cargo-home: "true"

  # The workspace's tests, with Postgres and the sandbox, split into the shards
  # scripts/test-shards.txt lists; with the features on, a missing database or
  # sandbox fails them rather than skipping. Each shard first checks that every
  # test target is in exactly one shard, so a new test file in none fails
  # here. The crash suite is a shard of its own, in the job below.
  test:
    name: Test (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
        with:
          target-cache: test
          backends: "true"
      - name: Test shard ${{ matrix.shard }} (with Postgres and the sandbox)
        # The runner's /tmp belongs to this job alone, so a test may create
        # and remove entries there (turn_workspace.rs).
        env:
          ATOMIC_TEST_PRIVATE_TMP: "1"
        run: scripts/test-shards.py run ${{ matrix.shard }}

  # The crash suite: every failpoint, triggered in turn, against real
  # workflows and the scripted fake model; each run killed there must finish
  # when recovered, with no completed step repeated. Its codex atom runs under
  # the sandbox, hence sandbox-tests. Linux only.
  crash:
    name: Crash suite
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
        with:
          target-cache: test
          backends: "true"
      - name: Crash suite
        run: scripts/test-shards.py run crash

  # The checks that need every test binary built: that the shards above run
  # each test exactly once, the milestones' acceptance, and that suites fail
  # without their backends. On main this job saves the test build's cache.
  acceptance:
    name: Acceptance and backends
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./.github/actions/rust-setup
        with:
          target-cache: test
          backends: "true"
          warm: "true"
      # The test features scripts/acceptance.py and scripts/test-shards.py
      # use, so nothing rebuilds for the steps below.
      - name: Build the tests
        id: build
        run: cargo test --workspace --locked --no-fail-fast --features atomic-agentic/postgres-tests,atomic-agentic/sandbox-tests --no-run
      # Each test the unsplit `cargo test --workspace` lists is listed by
      # exactly one shard, and no shard lists another.
      - name: Every test in exactly one shard
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: scripts/test-shards.py check
      # Each milestone's acceptance clauses, the tests that show each listed in
      # scripts/acceptance/; a listed test that fails, is ignored or no longer
      # runs fails the step.
      - name: M42a acceptance
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 scripts/acceptance.py m42a
      - name: M12 acceptance
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 scripts/acceptance.py m12
      - name: M35a acceptance
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 scripts/acceptance.py m35a
      - name: M39a acceptance
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 scripts/acceptance.py m39a
      - name: M45 acceptance
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 scripts/acceptance.py m45
      # A suite that cannot reach its backend fails; it never skips. The
      # Postgres and sandbox suites run once more with their backend missing,
      # and every one of their tests must fail, naming it. The sandbox half
      # reuses the build above; the Postgres half rebuilds
      # atomic-agentic-durable with its own features.
      - name: Suites fail without their backends
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          scripts/backends-check.sh postgres
          old="$(sysctl -n user.max_user_namespaces)"
          sudo sysctl -w user.max_user_namespaces=0
          status=0
          scripts/backends-check.sh sandbox || status=$?
          sudo sysctl -w user.max_user_namespaces="${old}"
          exit "${status}"
      - name: Save the build cache (main only)
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.build.outcome == 'success' }}
        uses: ./.github/actions/rust-cache-save
        with:
          setup: ${{ toJSON(steps.setup.outputs) }}

  # The plain build and the checks that need no test build. It restores the
  # test build's cache, whose dependencies the plain build shares.
  build:
    name: Build, lockfile and SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./.github/actions/rust-setup
        with:
          target-cache: test
      - run: scripts/v8-archive-test.sh
      - name: Build
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cargo build --workspace --locked
      # A compile-fail doctest checks that a test-only method is absent
      # without its feature, which the test shards' features turn on; it runs
      # only here, without them. The whole workspace is selected, as the
      # shards select it, so dependencies resolve the same features and the
      # cached builds serve (selecting one package rebuilds V8 differently).
      # With the feature on, as it would be if a dependency enabled it, the
      # doctest's twin runs in its place and passes; the step requires the
      # compile-fail test itself to have run and passed.
      - name: Doctests without the test features
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --locked --doc 2>&1 | tee "${RUNNER_TEMP}/doctests.log"
          grep -E '^test crates/atomic-core/src/codex\.rs - codex::ExecSandbox \(line [0-9]+\) - compile fail \.\.\. ok$' "${RUNNER_TEMP}/doctests.log" ||
            { echo "the compile-fail doctest of codex::ExecSandbox did not run and pass without the test features" >&2; exit 1; }
      # The graph still resolves from scratch onto the libsqlite3-sys Codex
      # locks, which both Codex and the durare fork link.
      - name: Lockfile resolves from scratch
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: scripts/lock-resolves.sh
      # Each V8 version deps/v8.toml lists as locked but unbuilt stays out of
      # the build graph.
      - name: Unbuilt V8 versions stay unbuilt
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: scripts/lock-check.sh v8-built
      # The release SBOM must list every fork at its pinned revision.
      - name: SBOM
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          cdx=cargo-cyclonedx-x86_64-unknown-linux-gnu
          curl -fsSLo /tmp/cdx.tar.xz "https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-0.5.10/${cdx}.tar.xz"
          echo "2e4ef64a53c0a38d4b7d805c593b5f47ecd29821e98d81e484d03abaa0edb95f  /tmp/cdx.tar.xz" | sha256sum -c -
          tar -xJf /tmp/cdx.tar.xz -C "$HOME/.cargo/bin" --strip-components=1 "${cdx}/cargo-cyclonedx"
          scripts/sbom.sh

  # The one check that stands for all the Linux Rust jobs above, under the
  # name the single Rust job had.
  rust:
    name: Rust (ubuntu-24.04)
    # always(), not !cancelled(): a cancelled run must end this check as a
    # failure, not as skipped, which a required check would count as passed.
    # The step fails on any result but success, cancelled and skipped too.
    if: ${{ always() }}
    needs: [clippy, test, crash, acceptance, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Every Linux Rust job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"${NEEDS}"
          jq -e 'all(.[]; .result == "success")' <<<"${NEEDS}" >/dev/null

  # macOS, started by hand with the workflow's macos input: the build and the
  # tests without the Linux-only backends, in one job. It keeps no build
  # cache, so that a run by hand never crowds Linux's out of the cache.
  rust-macos:
    name: Rust (macos-15)
    if: ${{ inputs.macos }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pinned Astro compiler host
        run: |
          python3 scripts/setup-deno.py "${RUNNER_TEMP}/atomic-deno"
          echo "${RUNNER_TEMP}/atomic-deno" >>"${GITHUB_PATH}"
      # rustup installs the toolchain and components rust-toolchain.toml names.
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: V8 archive
        run: |
          scripts/v8-archive.sh
          scripts/v8-archive-test.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --locked
      - name: Test (macOS)
        run: cargo test --workspace --locked --no-fail-fast
